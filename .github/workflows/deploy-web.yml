name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # config/prod.json solo lleva la URL y la clave publicable: son públicas por
      # diseño y la seguridad está en las políticas RLS. Nunca poner aquí la secret key.
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define-from-file=config/prod.json
      # El navegador guarda los archivos hasta 10 minutos. Con un nombre nuevo en
      # cada versión, la familia recibe siempre la última al abrir la app.
      - name: Nombre único por versión
        run: |
          v="${GITHUB_SHA::8}"
          cd build/web
          mv main.dart.js "main.$v.dart.js"
          sed -i "s/\"mainJsPath\":\"main.dart.js\"/\"mainJsPath\":\"main.$v.dart.js\"/" flutter_bootstrap.js
          grep -q "main.$v.dart.js" flutter_bootstrap.js
          mv flutter_bootstrap.js "flutter_bootstrap.$v.js"
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.$v.js/" index.html
          grep -q "flutter_bootstrap.$v.js" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
